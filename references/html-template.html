<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    color: #2a2a28;
    margin: 0;
    padding: 40px 32px;
    font-size: 15px;
    line-height: 1.55;
    background: #fff;
  }
  .container { max-width: 1600px; margin: 0 auto; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 24px;
  }
  .header-left { flex: 1; min-width: 0; }
  h1 { font-size: 24px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; font-weight: 500; margin: 32px 0 14px; color: #2a2a28; }
  .meta { color: #6f6e6a; font-size: 13px; }

  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    color: #2a2a28;
    background: #fff;
    border: 0.5px solid #d3d1c7;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #f8f7f3; border-color: #888780; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .btn svg { width: 14px; height: 14px; }

  .screens {
    background: #f8f7f3;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .screens-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .screen-card {
    background: #fff;
    border: 0.5px solid #d3d1c7;
    border-radius: 8px;
    padding: 12px;
    display: inline-block;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
  }
  .screen-card:hover { border-color: #888780; }
  .screen-card img {
    display: block;
    max-width: 100%;
    width: 280px;
    height: auto;
    border-radius: 4px;
    border: 0.5px solid #ece9df;
  }
  .screen-card.single img { width: 600px; }
  .screen-card .caption { margin-top: 10px; font-size: 13px; color: #444441; font-weight: 500; }
  .screen-card .subcaption { font-size: 12px; color: #6f6e6a; margin-top: 2px; }

  .screen-textonly {
    background: #fff;
    border: 0.5px dashed #b4b2a9;
    border-radius: 8px;
    padding: 14px 18px;
    display: inline-block;
    min-width: 240px;
  }
  .screen-textonly .caption { font-size: 13px; color: #444441; font-weight: 500; }
  .screen-textonly .subcaption { font-size: 12px; color: #6f6e6a; margin-top: 4px; }

  .figma-card {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 0.5px solid #d3d1c7;
    border-radius: 8px;
    padding: 14px 18px;
    text-decoration: none;
    color: inherit;
  }
  .figma-card:hover { border-color: #888780; }
  .figma-icon {
    width: 28px;
    height: 28px;
    background: #f24e1e;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
  }
  .figma-text { font-size: 13px; }
  .figma-text strong { display: block; font-weight: 500; }
  .figma-text span { color: #6f6e6a; font-size: 12px; }

  .legend {
    color: #6f6e6a;
    font-size: 13px;
    margin: 0 0 14px;
    padding: 10px 14px;
    background: #f8f7f3;
    border-radius: 8px;
    display: inline-block;
  }

  .table-wrap {
    overflow-x: auto;
    border: 0.5px solid #d3d1c7;
    border-radius: 10px;
    background: #fff;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 1180px; }
  th, td { text-align: left; padding: 14px 16px; border-bottom: 0.5px solid #ece9df; vertical-align: top; }
  th { font-weight: 500; color: #5f5e5a; font-size: 12px; background: #f8f7f3; letter-spacing: 0.02em; border-bottom: 0.5px solid #d3d1c7; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf6; }

  .col-type        { width: 56px; }
  .col-heuristic   { width: 180px; }
  .col-problem     { width: auto; min-width: 360px; }
  .col-risk        { width: 160px; }
  .col-criticality { width: 130px; }
  .col-action      { width: auto; min-width: 320px; }

  .icon { font-size: 18px; line-height: 1; }
  .good td { color: #b4b2a9; }
  .good td:first-child { color: inherit; }

  .top-verdict {
    margin-bottom: 28px;
    padding: 22px 26px;
    background: linear-gradient(135deg, #f3faf4 0%, #eaf5ec 100%);
    border-radius: 12px;
    border-left: 4px solid #1d9e75;
  }
  .top-verdict .scores {
    display: flex; gap: 32px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .top-verdict .score-block { display: flex; align-items: baseline; gap: 8px; }
  .top-verdict .score-block .label { color: #6f6e6a; font-size: 13px; }
  .top-verdict .score-block .value { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; color: #1d9e75; }
  .top-verdict .verdict-row {
    display: flex; gap: 16px; margin-bottom: 8px; align-items: baseline;
  }
  .top-verdict .verdict-row:last-child { margin-bottom: 0; }
  .top-verdict .verdict-label {
    color: #6f6e6a; width: 240px; flex-shrink: 0; font-size: 13px;
  }
  .top-verdict .verdict-value { flex: 1; font-size: 14px; line-height: 1.55; color: #2a2a28; }

  .disclaimer {
    margin-top: 24px;
    padding: 12px 16px;
    background: #faf4e8;
    border: 0.5px solid #ead9b5;
    border-radius: 8px;
    color: #6e5b2b;
    font-size: 12px;
  }

  @media print {
    @page { size: A3 landscape; margin: 12mm; }
    body { padding: 0; font-size: 12px; }
    .actions { display: none !important; }
    .table-wrap { overflow: visible; border-radius: 4px; }
    table { min-width: auto; font-size: 11px; }
    th, td { padding: 8px 10px; }
    tr { page-break-inside: avoid; }
    .screen-card, .top-verdict, .disclaimer { page-break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
  }

  body.exporting .actions { visibility: hidden; }
  body.exporting #audit-root {
    padding: 24px;
    box-sizing: border-box;
    background: #fff;
    border-radius: 0;
    width: 1500px !important;
    max-width: 1500px !important;
    min-width: 1500px;
  }
  body.exporting .table-wrap {
    overflow: visible !important;
  }
  body.exporting .col-type { width: 56px !important; }
  body.exporting .col-heuristic { width: 180px !important; }
  body.exporting .col-risk { width: 160px !important; }
  body.exporting .col-criticality { width: 130px !important; }
  body.exporting .col-problem,
  body.exporting .col-action {
    width: 440px !important;
    min-width: 440px !important;
    max-width: 440px !important;
  }
  body.exporting table { table-layout: fixed; }
</style>
</head>
<body>
<div class="container" id="audit-root">
  <div class="header">
    <div class="header-left">
      <h1>{{TITLE}}</h1>
      <div class="meta">{{META}}</div>
    </div>
    <div class="actions">
      <button class="btn" id="pdf-btn" onclick="downloadPDF()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Скачать PDF
      </button>
      <button class="btn" id="jpeg-btn" onclick="downloadJPEG()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Скачать JPEG
      </button>
    </div>
  </div>

  <div class="top-verdict">
    <div class="scores">
      <div class="score-block">
        <span class="label">Общая оценка</span>
        <span class="value">{{SCORE}}%</span>
      </div>
    </div>
    <div class="verdict-row">
      <div class="verdict-label">Главный риск</div>
      <div class="verdict-value">{{MAIN_RISK}}</div>
    </div>
    <div class="verdict-row">
      <div class="verdict-label">Что исправить в первую очередь</div>
      <div class="verdict-value">{{FIRST_PRIORITY}}</div>
    </div>
  </div>

  <h2>Что разбираем</h2>
  <div class="screens">
    <div class="screens-row">
      {{SCREENS_HTML}}
    </div>
  </div>

  <div class="legend">{{LEGEND}}</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-type">Тип</th>
          <th class="col-heuristic">Эвристика</th>
          <th class="col-problem">Проблема</th>
          <th class="col-risk">Риск</th>
          <th class="col-criticality">Критичность</th>
          <th class="col-action">Что сделать</th>
        </tr>
      </thead>
      <tbody>
{{ROWS_HTML}}
      </tbody>
    </table>
  </div>

{{DISCLAIMER_HTML}}
</div>

<script>
window.ARTIFACT_PREFIX = 'ux-audit';

function fileBaseName(prefix) {
  return (prefix || 'ux-audit') + '-' + new Date().toISOString().slice(0, 10);
}

async function downloadJPEG() {
  const btn = document.getElementById('jpeg-btn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Готовим...';
  document.body.classList.add('exporting');
  try {
    if (typeof html2canvas === 'undefined') {
      throw new Error('Библиотека html2canvas не загрузилась');
    }
    // Ждём reflow после добавления body.exporting (max-width snyat, overflow visible)
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const node = document.getElementById('audit-root');
    const width = Math.max(node.scrollWidth, node.offsetWidth);
    const canvas = await html2canvas(node, {
      scale: 1.5, backgroundColor: '#ffffff', useCORS: true, logging: false,
      windowWidth: width + 100,
      width: width
    });
    canvas.toBlob(function(blob) {
      if (!blob) { alert('Не удалось создать JPEG'); return; }
      const link = document.createElement('a');
      link.download = fileBaseName(window.ARTIFACT_PREFIX) + '.jpg';
      link.href = URL.createObjectURL(blob);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 2000);
    }, 'image/jpeg', 0.92);
  } catch (err) {
    alert('Не удалось сохранить JPEG: ' + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
    document.body.classList.remove('exporting');
  }
}

async function downloadPDF() {
  const btn = document.getElementById('pdf-btn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'Готовим...';
  document.body.classList.add('exporting');
  try {
    if (typeof html2canvas === 'undefined') throw new Error('html2canvas не загрузился');
    if (typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF) throw new Error('jsPDF не загрузился');
    // Ждём reflow после добавления body.exporting (max-width snyat, overflow visible)
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const node = document.getElementById('audit-root');
    const width = Math.max(node.scrollWidth, node.offsetWidth);
    const canvas = await html2canvas(node, {
      scale: 1.5, backgroundColor: '#ffffff', useCORS: true, logging: false,
      windowWidth: width + 100,
      width: width
    });
    const imgData = canvas.toDataURL('image/jpeg', 0.85);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    // Ручное скачивание через blob — обходит блокировку sandbox через window.open
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileBaseName(window.ARTIFACT_PREFIX) + '.pdf';
    link.href = url;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) {
    alert('Не удалось сохранить PDF в preview: ' + err.message + '\n\nПопробуй скачать HTML-файл (кнопка «Скачать» вверху артефакта) и открыть его локально в браузере — там кнопки точно работают.');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
    document.body.classList.remove('exporting');
  }
}
</script>
</body>
</html>
